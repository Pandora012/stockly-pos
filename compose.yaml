services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockly
      POSTGRES_USER: stockly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stockly_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockly -d stockly"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  stockly_postgres:
